[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tigerbook-scraper"
version = "0.1.0"
description = "Resumable, evidence-based TigerNet directory export"
requires-python = ">=3.11"
dependencies = ["playwright==1.62.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
